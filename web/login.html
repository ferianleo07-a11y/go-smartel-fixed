<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - SmarTel: Hotel Property Management System</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">

  <script>
    (function() {
      const saved = localStorage.getItem("smartel_theme");
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved ? saved : (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <!-- Floating Theme Switcher -->
  <div style="position: absolute; top: 1.5rem; right: 1.5rem; z-index: 10;">
    <button class="theme-switch-btn" onclick="toggleTheme()" title="Ubah Tema (Dark/Light)">
      <svg class="svg-icon icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      <svg class="svg-icon icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    </button>
  </div>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 1.25rem;">
        <a href="/" style="display: inline-flex; align-items: center; gap: 0.4rem; color: var(--text-muted); font-size: 0.8rem; font-weight: 500;">
          <svg class="svg-icon sm" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          <span>Kembali ke Beranda</span>
        </a>
      </div>

      <div class="auth-header">
        <div class="brand-icon-box" style="margin: 0 auto; width: 44px; height: 44px; font-size: 1.2rem;">ST</div>
        <h1>SmarTel</h1>
        <p>Konsol Manajemen Hotel & Akuntansi USALI</p>
      </div>

      <div id="alertMessage" class="alert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Alamat Email Staf</label>
          <input type="email" id="email" class="form-control" placeholder="admin@hotelanda.com" required>
        </div>

        <div class="form-group">
          <label for="password">Kata Sandi</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="quick-action-btn primary" style="width: 100%; justify-content: center; padding: 0.75rem; margin-top: 0.5rem;">
          Masuk ke Workspace
        </button>
      </form>

      <div class="auth-footer">
        Belum mendaftarkan properti hotel Anda? <a href="/register">Daftar Akun Baru</a>
      </div>
    </div>
  </div>

  <script src="/static/js/auth.js"></script>
  <script>
    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-theme") || "light";
      const next = current === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("smartel_theme", next);
    }

    document.addEventListener("DOMContentLoaded", () => {
      initLoginForm();
    });
  </script>
</body>
</html>
